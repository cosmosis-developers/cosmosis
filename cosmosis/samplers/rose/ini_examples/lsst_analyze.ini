;***********************************
;multinest is the default sampler
;***********************************
[runtime]
#sampler = test
#sampler = emugen
sampler = rose
#sampler = emcee
verbosity = quiet
#verbosity = standard


[rose]
# type of architecture to use for the neural network, MLP is the only available for now, others (e.g., ResMLP) will be added later
nn_model = MLP
# transformation of data to be used for the neural network per likelihood/emulator
# options: log_norm, norm, signed_log_norm, PCA
data_trafo = signed_log_norm
# number of PCA components to use for the planck likelihood, default is 32
# must be specified for all likelihoods used
n_pca = 
# keys to use for the neural network, fixed_keys are not sampled, error_keys are used for the error propagation
keys = 
fixed_keys = 
error_keys = 
last_emulated_module = 
# prior module to use for the neural network in the final sampling phase or when re-using the trained models
# since we're substituting the whole pipeline with just one module for the emulated datavector, 
# we need to add a prior-module to the emulated pipeline when required
prior_module = w0waprior

# ROSE main setup:
# chi2 cut-off to exclude points from the training set
chi2_cut_off = 1e6
# file with temperatures for each training iteration (either constant or increasing from >0 to 1)
tempering_file = rose_test/tempering.txt
# number of iterations to run for the training
iterations = 5
# initial size of the training set
initial_size = 1000  #800 #400 #200 
# resample size for the training = additional points to add to the training set per iteration
resample_size = 500 #400 #200 #100 
# the size of testing set in the last iteration, sampled ffrom the 1-sigma or 2-sigma (credible) region of the one-before-last MCMC chain
# default: int(0.5 * self.resample_size)
final_test_size = 1000
# fraction of the chain (ranked by posterior) that defines the
# "1-sigma"/68% credible region from which test points are drawn
test_credible_fraction = 0.95
# customisable loss-function (e.g., covariance-weighted)
loss_function = standard

# KL convergence settings
# set kl_convergence = T in the ini file to enable it. When enabled, before
# the final sampling stage the test points are folded into the training
# set, the emulator is retrained, and the KL divergence between the
# emulated posteriors of two consecutive iterations is computed. If it
# exceeds kl_threshold, extra training points are added and the emulator
# is retrained until the criterion is met or kl_max_retrain attempts are
# exhausted.
kl_convergence = F
kl_threshold = 0.1
kl_max_retrain = 5
kl_extra_size = 500
kl_n_samples = 2000


# NN settings:
#n_hidden = [512, 512, 512] can be changed in nn_emulator.py
batch_size = 128 #32 #24  #128 
training_iterations = 5



# Saving models and re-loading/re-using them:
# options to save models in each training cycle or only the final model, as well as training and testing sets
save_outputs = all
save_outputs_dir = rose_test/convergence/lsst_forecast_w0wadesi/outputs
trained_before =F
# Ignore pipeline params a loaded emulator wasn't trained on (e.g. the
# CMB-only planck emulator does not depend on supernova_params--m).
ignore_missing_emu_params = T
load_emu_filename = 

# MCMC settings:
emcee_walkers = 30  # need >= 2*ndim (29) for red-blue move; 60
emcee_samples = 3000 #5000 #10_000 
emcee_burn = 0.3
emcee_thin = 1
# Final MCMC sampling phase
# Enable nautilus for final iteration
use_nautilus_final = T
# Optional: customize nautilus parameters
nautilus_n_live = 3000 #5000
nautilus_n_eff = 30000 #30000
# Enable NUTS for final iteration
use_nuts_final = F
# Optional: customize NUTS parameters
nuts_sample_unit_space = T
nuts_target_accept_prob = 0.65 #0.7
nuts_step_size = 0.05
nuts_max_tree_depth = 12
nuts_num_adaptation_steps = 2000 #1500
nuts_num_burnin_steps = 2000 #1500
nuts_num_results = 2000
nuts_num_chains = 2

[output]
filename=  rose_test/scaling/w0wacosmo_cosmo_all_nuisance_signedlog_max/lsst_rose_3x2pt_forecast_nautilus_from_emu.txt    
format=text

[test]
save_dir=output/lsst_forecast_w0wadesi_negative

[star]
nsample_dimension=5

[grid]
nsample_dimension=20

[fisher]
step_size = 0.02


[pipeline]
timing=F
debug=F
modules = w0waprior consistency camb  extrapolate 
          fast_pt load_nz photoz_bias_source photoz_bias_lens 
          unbiased_galaxies 
          nonlinear_linear_alignment  pk_to_cl galaxy_bias 
          shear_calibration add_intrinsic 2pt_like 

values = examples/lsst_forecast/lsst_values_w0wadesi.ini
priors = examples/lsst_forecast/lsst_priors_y1.ini
likelihoods = lsst
extra_output = 


[w0waprior]
file = utility/exclude_w0_wa/w0wa_sum_prior.py




[2pt_like]
file = likelihood/2pt/2pt_like.py
data_file=examples/lsst_forecast/lsst_simulation_w0wadesi.fits #examples/lsst_forecast/lsst_simulation.fits
covmat_name=COVMAT
like_name=lsst
data_sets=shear_cl galaxy_shear_cl galaxy_cl

; we put these in a separate file because they are long
%include examples/lsst_forecast/scale-cuts.ini

[load_nz]
file = number_density/load_nz_fits/load_nz_fits.py
nz_file = examples/lsst_forecast/lsst_simulation_w0wadesi.fits #examples/lsst_forecast/lsst_simulation.fits
data_sets=source lens
prefix_section=T
prefix_extension=T

[photoz_bias_source]
file = number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_source
bias_section = photoz_source_errors

[photoz_bias_lens]
file = number_density/photoz_bias/photoz_bias.py
mode = additive
sample = nz_lens
bias_section = photoz_lens_errors


[unbiased_galaxies]
file = bias/no_bias/no_bias.py

[shear_calibration]
file = shear/shear_bias/shear_m_bias.py
verbose = F


# The remainder of the pipeline is identical to the one used in the lsst_simulate.ini
# file adjacent to this one.
# We could put this text in a file lsst_common.ini and use the command:
# %include lsst_common.ini but I didn't want to be confusing

[nonlinear_linear_alignment]
#file = intrinsic_alignments/la_model/linear_alignments_interface.py
#method = bk_corrected
#do_galaxy_intrinsic = T
file = intrinsic_alignments/tatt/tatt_interface.py
sub_lowk = F
do_galaxy_intrinsic = F
ia_model = tatt

[add_intrinsic]
file=shear/add_intrinsic/add_intrinsic.py
shear-shear=T
position-shear=T


[consistency]
file = utility/consistency/consistency_interface.py

[camb]
file = boltzmann/camb/camb_interface.py
mode=all
lmax=5000 #2500
feedback=0
zmin_background = 0.
zmax_background = 4.
nz_background = 256
kmin=1e-4
kmax = 50.0
kmax_extrapolate = 50.0
use_ppf_w = True
halofit_version = mead2020_feedback

[extrapolate]
file = boltzmann/extrapolate/extrapolate_power.py 
kmax = 500.

[galaxy_bias]
file = bias/binwise_bias/bin_bias.py


; This module uses the Limber approximation to compute shear-shear C_ell
; given the shear kernel (which is derived from the number density and 
; from geometry)

[pk_to_cl]
file = structure/projection/project_2d.py
ell_min_logspaced = 20.0
ell_max_logspaced = 5000. #2627.21847662
n_ell_logspaced = 20
shear-shear = source-source
position-shear = lens-source
position-position=lens-lens
shear-intrinsic = source-source
intrinsic-intrinsic = source-source
position-intrinsic = lens-source
verbose = F #T
sig_over_dchi = 20. 
shear_kernel_dchi = 10. 
;auto_only=lingal-lingal

[fast_pt]
file = structure/fast_pt/fast_pt_interface.py
do_ia = T
k_res_fac = 0.5
verbose = F